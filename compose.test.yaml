# Se usa SIEMPRE con "-p catalogo-test" encima de compose.yaml:
#   docker compose -p catalogo-test -f compose.yaml -f compose.test.yaml ...
# El nombre de proyecto separa el volumen (catalogo-test_catalogo_pgdata) del de evaluacion.
services:
  db:
    environment:
      POSTGRES_DB: catalogo_test

  app:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/catalogo_test?sslmode=disable
    ports: !override
      - "${APP_TEST_PORT:-18080}:8080"

  pruebas:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/catalogo_test?sslmode=disable
      EXCEL_PATH: /app/data/CatalogoServicios.xlsx
    volumes:
      - ./data:/app/data:ro
    working_dir: /src
    command: ["go", "test", "./...", "-count=1"]
