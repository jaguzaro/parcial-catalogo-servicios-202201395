services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    volumes:
      - catalogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: final
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      SESSION_TTL: ${SESSION_TTL:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EXCEL_PATH: ${EXCEL_PATH:-/app/data/CatalogoServicios.xlsx}
      DEMO_ADMIN_USUARIO: ${DEMO_ADMIN_USUARIO:-}
      DEMO_ADMIN_CONTRASENA: ${DEMO_ADMIN_CONTRASENA:-}
      DEMO_CONSULTA_USUARIO: ${DEMO_CONSULTA_USUARIO:-}
      DEMO_CONSULTA_CONTRASENA: ${DEMO_CONSULTA_CONTRASENA:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "/app/catalogo", "salud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  catalogo_pgdata:
